---
name: Continuous Integration
permissions:
  contents: write

on:
  # for feature branches
  pull_request:
  # for releases
  push:
    branches:
      - master
  # for merge queues
  merge_group:
    types:
      - checks_requested

concurrency:
  group: ${{ (github.ref_name != github.event.repository.default_branch) && format('{0}-{1}', github.ref, github.workflow) || github.run_id }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

jobs:
  ci:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    name: ci
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - run: |
          IMAGE_NAME=riak_exporter:latest
          CONTAINER_NAME=riak_exporter
          PPORT=8097

          docker buildx build . --load --tag "${IMAGE_NAME}"
          docker run --detach --rm --name "${CONTAINER_NAME}" -p "${PPORT}":8097 "${IMAGE_NAME}"

          sleep 5

          METRICS=$(curl localhost:"${PPORT}")
          EXPECTED="<a href=\"/metrics\">/metrics</a>"
          if [[ "${METRICS}" != "${EXPECTED}" ]]; then
            echo "curl returned ${METRICS}, but we expected ${EXPECTED}!"
            exit 1
          else
            docker stop "${CONTAINER_NAME}"
            echo "All good!"
          fi

  release:
    if: |
      github.event_name == 'push' &&
      github.ref_name == github.event.repository.default_branch &&
      !startsWith(github.event.head_commit.message, 'no-release')
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Bump version and push tag
      id: tag-version
      uses: mathieudutour/github-tag-action@af99e60ce8132224b8e6ebab5023449fe256ed46 # v7.0.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        dry_run: true
        release_branches: ${{ github.event.repository.default_branch }}

    - name: Create a GitHub release
      if: steps.tag-version.outputs.new_tag != ''
      run: gh release create "${NEW_TAG}" --generate-notes --latest=false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        NEW_TAG: ${{ steps.tag-version.outputs.new_tag }}
